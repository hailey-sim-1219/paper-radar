<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="관심 저널의 최신 정량연구를 한눈에 확인하는 개인용 논문 레이더">
  <title>페이퍼 토벌</title>
  <link rel="icon" type="image/png" href="assets/chiikawa-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="#main" aria-label="페이퍼 토벌 홈">
        <img
          class="brand-logo"
          src="assets/chiikawa-logo.png"
          alt=""
        >
        <span>페이퍼 토벌</span>
      </a>
      <nav class="nav" aria-label="기본 메뉴">
        <button class="nav-link active" data-view="main">Main</button>
        <button class="nav-link" data-view="saved">Saved Papers <span id="saved-count" class="nav-count">0</span></button>
      </nav>
      <p class="updated" id="updated">데이터 불러오는 중…</p>
    </div>
  </header>

  <main class="shell">

    <section class="toolbar" aria-label="논문 검색과 필터">
      <div class="top-filters">
        <label class="search-wrap">
          <span class="sr-only">논문 검색</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="search" type="search" placeholder="제목, 초록, 저자, 키워드 검색">
        </label>
        <select id="journal-filter" aria-label="저널 필터"><option value="">모든 저널</option></select>
        <select id="sort" aria-label="정렬 방식">
          <option value="publication">게재일 최신순</option>
          <option value="first_seen">신규 등록순</option>
        </select>
      </div>

      <details class="filter-group" id="topic-details">
        <summary><span>연구주제</span><span class="filter-summary"><b id="topic-selected">선택 없음</b><i aria-hidden="true">⌄</i></span></summary>
        <div id="topic-options" class="check-grid"></div>
      </details>
      <details class="filter-group" id="method-details">
        <summary><span>방법론</span><span class="filter-summary"><b id="method-selected">선택 없음</b><i aria-hidden="true">⌄</i></span></summary>
        <div id="method-options" class="check-grid"></div>
      </details>
      <div id="active-filters" class="active-filters"></div>
    </section>

    <section class="summary" aria-live="polite">
      <p><strong id="paper-count">0</strong>편의 논문</p>
      <button id="reset" type="button">필터 초기화</button>
    </section>
    <section id="paper-list" class="paper-list" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <div class="empty-bookmark">⌑</div>
      <p id="empty-title">조건에 맞는 논문이 없습니다.</p>
      <span id="empty-help">필터를 변경해 다시 확인해보세요.</span>
      <button id="empty-action" type="button">전체 논문 보기</button>
    </div>
  </main>

  <dialog id="paper-dialog" class="paper-dialog">
    <div class="dialog-head">
      <button id="dialog-bookmark" class="bookmark dialog-bookmark" type="button" aria-label="논문 저장"></button>
      <button id="dialog-close" class="dialog-close" type="button" aria-label="닫기">×</button>
    </div>
    <article id="dialog-content"></article>
  </dialog>

  <footer class="shell footer"><p>Metadata and abstracts from <a href="https://openalex.org" target="_blank" rel="noreferrer">OpenAlex</a>.</p></footer>
  <script src="app.js" defer></script>
</body>
</html>
